---
name: Test Ansible Playbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install Ansible Galaxy collections
        run: uv run ansible-galaxy collection install -r collections/requirements.yml

      - name: Run ansible-playbook syntax check
        run: uv run ansible-playbook local.yml --syntax-check

      - name: Run ansible-playbook in check mode
        run: uv run ansible-playbook local.yml --check
